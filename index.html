<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Comunitario Playa de Ponce</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    width: 100%;
    font-family: 'Georgia', 'Times New Roman', serif;
    background: none;
  }
  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 2s ease-in-out;
    z-index: 0;
  }
  .slide.active {
    opacity: 1;
  }
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(6, 30, 45, 0.55) 0%,
      rgba(6, 30, 45, 0.65) 50%,
      rgba(6, 30, 45, 0.8) 100%
    );
    z-index: 1;
  }
  .content {
    position: relative;
    z-index: 3;
    text-align: center;
    color: #ffffff;
    padding: 2rem;
    max-width: 900px;
  }
  h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 1.25;
    font-weight: 700;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  }
  .subtitle {
    margin-top: 1.5rem;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    font-weight: 300;
    letter-spacing: 0.03em;
    color: #e8f0f2;
  }
  .divider {
    width: 80px;
    height: 3px;
    background-color: #ffd580;
    margin: 1.8rem auto;
    border-radius: 2px;
  }
  .buttons {
    margin-top: 2.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    justify-content: center;
  }
  .btn {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: #ffffff;
    padding: 0.95rem 2.4rem;
    border: 2px solid #ffd580;
    border-radius: 4px;
    background: rgba(255, 213, 128, 0.08);
    transition: background 0.25s ease, color 0.25s ease, transform 0.2s ease;
    display: inline-block;
  }
  .btn:hover {
    background: #ffd580;
    color: #061e2d;
    transform: translateY(-2px);
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="slide active" style="background-image: url('https://raw.githubusercontent.com/raicescosteras2026/Plancomunitario/main/playa1.jpg');"></div>
    <div class="slide" style="background-image: url('https://raw.githubusercontent.com/raicescosteras2026/Plancomunitario/main/playa2.jpg');"></div>
    <div class="slide" style="background-image: url('https://raw.githubusercontent.com/raicescosteras2026/Plancomunitario/main/playa3.jpg');"></div>
    <div class="overlay"></div>
    <div class="content">
      <h1>Plan Comunitario de Preparación y Resiliencia<br>Playa de Ponce</h1>
      <div class="divider"></div>
      <p class="subtitle">Un Nuevo Amanecer Inc.</p>
      <p class="subtitle">Proyecto Raíces Costeras</p>
      <div class="buttons">
     
        <a class="btn" href="planfinal.html">Ver Plan</a>
      </div>
    </div>
  </div>
  <script>
    const slides = document.querySelectorAll('.slide');
    let current = 0;
    setInterval(() => {
      slides[current].classList.remove('active');
      current = (current + 1) % slides.length;
      slides[current].classList.add('active');
    }, 5000);
  </script>
</body>
</html>
