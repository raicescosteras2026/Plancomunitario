<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximamente | Plan Comunitario Playa de Ponce</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
    font-family: 'Georgia', 'Times New Roman', serif;
  }

  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    background-image: url('https://raw.githubusercontent.com/raicescosteras2026/Plancomunitario/main/Playa%20de%20Ponce.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to bottom,
      rgba(6, 30, 45, 0.55) 0%,
      rgba(6, 30, 45, 0.65) 50%,
      rgba(6, 30, 45, 0.8) 100%
    );
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #ffffff;
    padding: 2rem;
    max-width: 900px;
  }

  .eyebrow {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.95rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #ffd580;
    margin-bottom: 1.5rem;
    font-weight: 600;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3.4rem);
    line-height: 1.25;
    font-weight: 700;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
  }

  .subtitle {
    margin-top: 1.5rem;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(0.95rem, 1.5vw, 1.15rem);
    font-weight: 300;
    letter-spacing: 0.03em;
    color: #e8f0f2;
  }

  .divider {
    width: 80px;
    height: 3px;
    background-color: #ffd580;
    margin: 1.8rem auto;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="overlay"></div>
    <div class="content">
      <div class="eyebrow">Próximamente</div>
      <h1>Plan Comunitario de Preparación y Resiliencia<br>Playa de Ponce</h1>
      <div class="divider"></div>
      <p class="subtitle">Proyecto Raices Costeras, Un Nuevo Amanecer Inc. </p>
    </div>
  </div>
</body>
</html>
